<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F62FF"/>
      <stop offset=".55" stop-color="#4D80FF"/>
      <stop offset="1" stop-color="#43C7A7"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2F73FF"/>
      <stop offset="1" stop-color="#43C7A7"/>
    </linearGradient>
    <linearGradient id="softGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E9F1FF"/>
      <stop offset=".52" stop-color="#ECFBF7"/>
      <stop offset="1" stop-color="#FFF0EC"/>
    </linearGradient>
    <pattern id="checker" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#F7F8FA"/>
      <rect width="11" height="11" fill="#E8EBEF"/>
      <rect x="11" y="11" width="11" height="11" fill="#E8EBEF"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#102049" flood-opacity=".16"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#102049" flood-opacity=".13"/>
    </filter>
    <clipPath id="heroClip"><rect x="60" y="60" width="1110" height="590" rx="34"/></clipPath>
    <clipPath id="visualClip"><rect x="1200" y="60" width="1140" height="590" rx="34"/></clipPath>
    <style>
      .sans { font-family: Inter, "SF Pro Display", Arial, sans-serif; }
      .label { font: 700 18px Inter, Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase; }
      .micro { font: 700 15px Inter, Arial, sans-serif; letter-spacing: .12em; }
      .wordmark { font: 700 55px Inter, Arial, sans-serif; letter-spacing: -.045em; }
      .concept { font: 650 25px Inter, Arial, sans-serif; letter-spacing: -.02em; }
      .body { font: 400 19px Inter, Arial, sans-serif; }
      .hex { font: 650 16px "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <rect width="2400" height="1600" fill="#ECEDEC"/>

  <!-- Hero identity -->
  <g clip-path="url(#heroClip)">
    <rect x="60" y="60" width="1110" height="590" fill="url(#heroGrad)"/>
    <circle cx="930" cy="130" r="260" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="2"/>
    <circle cx="930" cy="130" r="170" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>
    <path d="M-20 605 C240 410 510 730 830 480 C980 365 1090 350 1220 408" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="84"/>
    <path d="M-20 605 C240 410 510 730 830 480 C980 365 1090 350 1220 408" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2" stroke-dasharray="14 18"/>

    <!-- primary A mark with true negative-space counter -->
    <g transform="translate(135 145)">
      <path fill="#fff" fill-rule="evenodd" d="M144 0 L292 300 H222 L190 231 H97 L65 300 H0 L144 0 Z M144 102 L116 174 H173 Z"/>
      <path d="M62 249 C108 220 168 217 232 234" fill="none" stroke="#43C7A7" stroke-width="18" stroke-linecap="round"/>
      <circle cx="65" cy="248" r="7" fill="#fff"/>
      <circle cx="229" cy="234" r="7" fill="#fff"/>
    </g>
    <text x="490" y="318" fill="#fff" class="sans" font-size="104" font-weight="750" letter-spacing="-6">Autopus</text>
    <text x="495" y="365" fill="#fff" fill-opacity=".82" class="sans" font-size="23" letter-spacing=".02em">THE OPERATING SYSTEM FOR MODERN FLEETS</text>
    <rect x="490" y="407" width="356" height="58" rx="29" fill="#fff"/>
    <text x="525" y="445" fill="#0B1633" class="sans" font-size="20" font-weight="700">Automate. See clearly. Scale.</text>
    <text x="115" y="603" fill="#fff" fill-opacity=".78" class="micro">PRIMARY IDENTITY • LIGHT-FIRST • INTELLIGENT MOTION</text>
  </g>

  <!-- Generated supporting visual -->
  <g clip-path="url(#visualClip)">
    <rect x="1200" y="60" width="1140" height="590" fill="#fff"/>
    <image x="1200" y="60" width="1140" height="590" preserveAspectRatio="xMidYMid slice" xlink:href="autopus-fleet-visual.png"/>
    <rect x="1200" y="60" width="1140" height="590" fill="url(#softGrad)" opacity=".08"/>
    <rect x="1260" y="112" width="300" height="54" rx="27" fill="#fff" fill-opacity=".9" filter="url(#smallShadow)"/>
    <circle cx="1294" cy="139" r="9" fill="#43C7A7"/>
    <text x="1316" y="147" fill="#0B1633" class="sans" font-size="19" font-weight="650">48 vehicles connected</text>
    <rect x="1988" y="517" width="286" height="79" rx="18" fill="#0B1633" fill-opacity=".92" filter="url(#smallShadow)"/>
    <text x="2017" y="548" fill="#A9F0DE" class="micro">LIVE FLEET SIGNAL</text>
    <text x="2017" y="580" fill="#fff" class="sans" font-size="26" font-weight="700">76% occupancy  ↗</text>
  </g>

  <!-- Logo directions panel -->
  <rect x="60" y="680" width="1515" height="590" rx="34" fill="#FBFBF7"/>
  <text x="105" y="735" fill="#1F62FF" class="label">01 — Logo directions</text>
  <text x="105" y="780" fill="#0B1633" class="sans" font-size="28" font-weight="650">Five routes from evolution to reinvention</text>

  <!-- concept 01 -->
  <g transform="translate(105 825)">
    <rect width="430" height="184" rx="22" fill="#fff" stroke="#DFE3E8"/>
    <rect x="1" y="1" width="98" height="182" rx="21" fill="url(#checker)"/>
    <g transform="translate(22 47) scale(.29)">
      <path fill="#1F62FF" fill-rule="evenodd" d="M144 0 L292 300 H222 L190 231 H97 L65 300 H0 L144 0 Z M144 102 L116 174 H173 Z"/>
      <path d="M62 249 C108 220 168 217 232 234" fill="none" stroke="#43C7A7" stroke-width="18" stroke-linecap="round"/>
    </g>
    <text x="128" y="93" fill="#0B1633" class="wordmark">Autopus</text>
    <text x="128" y="125" fill="#6B7280" class="body">Refined road A</text>
    <circle cx="397" cy="31" r="15" fill="#1F62FF"/><text x="392" y="37" fill="#fff" class="sans" font-size="13" font-weight="700">1</text>
  </g>

  <!-- concept 02 -->
  <g transform="translate(557 825)">
    <rect width="430" height="184" rx="22" fill="#0B1633"/>
    <g transform="translate(24 46) scale(.3)">
      <path fill="#fff" fill-rule="evenodd" d="M144 0 L292 300 H222 L190 231 H97 L65 300 H0 L144 0 Z M144 102 L116 174 H173 Z"/>
      <path d="M50 258 C114 214 180 216 244 250" fill="none" stroke="#4B8AFF" stroke-width="20" stroke-linecap="round"/>
      <circle cx="48" cy="258" r="12" fill="#43C7A7"/><circle cx="246" cy="250" r="12" fill="#FF8F82"/>
    </g>
    <text x="130" y="93" fill="#fff" class="wordmark">Autopus</text>
    <text x="130" y="125" fill="#AFC2EA" class="body">Signal route A</text>
    <circle cx="397" cy="31" r="15" fill="#43C7A7"/><text x="392" y="37" fill="#0B1633" class="sans" font-size="13" font-weight="700">2</text>
  </g>

  <!-- concept 03 -->
  <g transform="translate(1009 825)">
    <rect width="520" height="184" rx="22" fill="#EAF2FF"/>
    <g transform="translate(25 35)">
      <circle cx="58" cy="57" r="49" fill="none" stroke="#1F62FF" stroke-width="13" stroke-dasharray="49 18" stroke-linecap="round"/>
      <path d="M31 93 L59 25 L88 93 M43 70 H76" fill="none" stroke="#0B1633" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="100" cy="28" r="7" fill="#43C7A7"/>
    </g>
    <text x="151" y="93" fill="#0B1633" class="wordmark">Autopus</text>
    <text x="151" y="125" fill="#53647F" class="body">Orbit intelligence</text>
    <circle cx="487" cy="31" r="15" fill="#1F62FF"/><text x="482" y="37" fill="#fff" class="sans" font-size="13" font-weight="700">3</text>
  </g>

  <!-- concept 04 -->
  <g transform="translate(105 1031)">
    <rect width="656" height="192" rx="22" fill="#EAF8F4"/>
    <g transform="translate(29 36)">
      <path d="M57 14 C23 15 18 48 45 59 C7 70 15 111 51 105 C52 139 96 139 98 105 C134 112 145 72 110 59 C136 43 119 8 87 20 C81 4 64 3 57 14Z" fill="none" stroke="#0E7A67" stroke-width="10" stroke-linecap="round"/>
      <path d="M55 92 L72 47 L92 92 M63 75 H84" fill="none" stroke="#1F62FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="174" y="96" fill="#0B1633" class="wordmark">Autopus</text>
    <text x="174" y="130" fill="#4D6A64" class="body">Octo loop — connected operations</text>
    <circle cx="623" cy="31" r="15" fill="#43C7A7"/><text x="618" y="37" fill="#0B1633" class="sans" font-size="13" font-weight="700">4</text>
  </g>

  <!-- concept 05 -->
  <g transform="translate(783 1031)">
    <rect width="746" height="192" rx="22" fill="#1F62FF"/>
    <g transform="translate(29 37)">
      <path d="M11 104 L58 14 L105 104 M36 104 L66 47 L94 104" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M25 112 C59 90 89 89 126 106" fill="none" stroke="#A9F0DE" stroke-width="9" stroke-linecap="round"/>
    </g>
    <text x="180" y="96" fill="#fff" class="wordmark">autopus</text>
    <text x="180" y="130" fill="#DDE8FF" class="body">Forward flow — compact digital mark</text>
    <circle cx="713" cy="31" r="15" fill="#fff"/><text x="708" y="37" fill="#1F62FF" class="sans" font-size="13" font-weight="700">5</text>
  </g>

  <!-- Palettes panel -->
  <rect x="1605" y="680" width="735" height="590" rx="34" fill="#fff"/>
  <text x="1650" y="735" fill="#1F62FF" class="label">02 — Color systems</text>
  <text x="1650" y="780" fill="#0B1633" class="sans" font-size="28" font-weight="650">Three light-mode directions</text>

  <g transform="translate(1650 820)">
    <text x="0" y="0" fill="#0B1633" class="concept">A. Clear Velocity</text>
    <text x="0" y="28" fill="#6B7280" class="body">Recommended • product-first</text>
    <rect x="0" y="42" width="142" height="60" rx="15" fill="#1F62FF"/>
    <rect x="126" y="42" width="142" height="60" rx="15" fill="#0B1633"/>
    <rect x="252" y="42" width="142" height="60" rx="15" fill="#43C7A7"/>
    <rect x="378" y="42" width="142" height="60" rx="15" fill="#DCEBFF"/>
    <rect x="504" y="42" width="142" height="60" rx="15" fill="#FBFBF7" stroke="#E5E7EB"/>
    <text x="0" y="126" fill="#53647F" class="hex">#1F62FF  #0B1633  #43C7A7  #DCEBFF  #FBFBF7</text>
  </g>

  <g transform="translate(1650 970)">
    <text x="0" y="0" fill="#0B1633" class="concept">B. Fleet Horizon</text>
    <text x="0" y="28" fill="#6B7280" class="body">Calm • operational • trustworthy</text>
    <rect x="0" y="42" width="142" height="60" rx="15" fill="#2A66C9"/>
    <rect x="126" y="42" width="142" height="60" rx="15" fill="#173B57"/>
    <rect x="252" y="42" width="142" height="60" rx="15" fill="#74C8C1"/>
    <rect x="378" y="42" width="142" height="60" rx="15" fill="#E5F4F2"/>
    <rect x="504" y="42" width="142" height="60" rx="15" fill="#FAFAF6" stroke="#E5E7EB"/>
    <text x="0" y="126" fill="#53647F" class="hex">#2A66C9  #173B57  #74C8C1  #E5F4F2  #FAFAF6</text>
  </g>

  <g transform="translate(1650 1120)">
    <text x="0" y="0" fill="#0B1633" class="concept">C. Warm Intelligence</text>
    <text x="0" y="28" fill="#6B7280" class="body">Distinctive • human • premium</text>
    <rect x="0" y="42" width="142" height="60" rx="15" fill="#3457D5"/>
    <rect x="126" y="42" width="142" height="60" rx="15" fill="#241F44"/>
    <rect x="252" y="42" width="142" height="60" rx="15" fill="#FF8F82"/>
    <rect x="378" y="42" width="142" height="60" rx="15" fill="#F1E9FF"/>
    <rect x="504" y="42" width="142" height="60" rx="15" fill="#FFF9F4" stroke="#E5E7EB"/>
    <text x="0" y="126" fill="#53647F" class="hex">#3457D5  #241F44  #FF8F82  #F1E9FF  #FFF9F4</text>
  </g>

  <!-- Footer application strip -->
  <rect x="60" y="1300" width="2280" height="240" rx="34" fill="#0B1633"/>
  <text x="105" y="1355" fill="#8EB2FF" class="label">03 — Application preview</text>
  <text x="105" y="1405" fill="#fff" class="sans" font-size="39" font-weight="650" letter-spacing="-1.4">One identity, from landing page to login.</text>
  <text x="105" y="1443" fill="#B9C6DF" class="body">Use light surfaces by default. Reserve navy for small, purposeful contrast moments.</text>

  <g transform="translate(1245 1334)" filter="url(#smallShadow)">
    <rect width="370" height="164" rx="20" fill="#FBFBF7"/>
    <g transform="translate(22 20) scale(.12)">
      <path fill="#1F62FF" fill-rule="evenodd" d="M144 0 L292 300 H222 L190 231 H97 L65 300 H0 L144 0 Z M144 102 L116 174 H173 Z"/>
    </g>
    <text x="67" y="51" fill="#0B1633" class="sans" font-size="22" font-weight="750">Autopus</text>
    <text x="22" y="93" fill="#0B1633" class="sans" font-size="18" font-weight="650">Welcome back</text>
    <rect x="22" y="111" width="220" height="30" rx="8" fill="#EDF1F6"/>
    <rect x="258" y="111" width="90" height="30" rx="15" fill="#1F62FF"/>
    <text x="280" y="132" fill="#fff" class="sans" font-size="12" font-weight="700">LOG IN</text>
  </g>

  <g transform="translate(1640 1334)" filter="url(#smallShadow)">
    <rect width="650" height="164" rx="20" fill="url(#softGrad)"/>
    <text x="28" y="45" fill="#1F62FF" class="micro">AUTOPUS FLEET SIGNAL</text>
    <text x="28" y="86" fill="#0B1633" class="sans" font-size="28" font-weight="700">Your fleet, clearly in motion.</text>
    <rect x="28" y="111" width="142" height="34" rx="17" fill="#1F62FF"/>
    <text x="55" y="133" fill="#fff" class="sans" font-size="13" font-weight="700">BOOK A DEMO  →</text>
    <circle cx="566" cy="78" r="49" fill="#fff" fill-opacity=".74"/>
    <path d="M537 101 L566 43 L596 101 M549 82 H585" fill="none" stroke="#1F62FF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
